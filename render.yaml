services:
  # User-facing API. Free plan — spins down after 15min idle, which would
  # reproduce the "request timed out" App Review rejection from build
  # 1.0 (5) on the old AWS box unless something pings /health often enough
  # to keep it awake. See RENDER_DEPLOY.md: set up an UptimeRobot monitor
  # against /health at an interval under 15min — GitHub Actions cron is
  # NOT reliable enough for this (this repo's own uptime-check.yml showed
  # GitHub's free cron firing only ~every 2h in practice, not the 15min
  # Render needs). This uses ~730 of the account's shared 750 free
  # instance-hours/month on its own — see the yamnet note below for why
  # that service is deliberately NOT also kept warm.
  - name: vibemeter-api
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - key: YAMNET_URL
        fromService:
          name: vibemeter-yamnet
          type: pserv
          property: hostport
      # Everything below is a secret/connection string with no safe
      # default — set these once in the Render dashboard after the
      # Blueprint is created (Neon connection string, Upstash Redis URL,
      # Firebase/Google/Anthropic keys). sync:false means Render prompts
      # for a value instead of baking one into this file.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # Audio classification sidecar, called synchronously from AnalyseAudio
  # (api/handlers/analyse.go) on the check-in path. Free plan, deliberately
  # NOT kept warm: Render's 750 free instance-hours/month are shared across
  # every free service in the workspace, and vibemeter-api above already
  # uses nearly all of it staying always-on. Pinging this one too would
  # need ~1460 combined hours/month, blow the shared budget around
  # mid-month, and get BOTH free services suspended until next month — a
  # full outage, worse than what this causes instead: the first audio
  # upload after >15min idle eats a ~30-60s cold start on that one
  # endpoint. Internal only: no public URL, reachable from vibemeter-api
  # via the fromService hostport above.
  - name: vibemeter-yamnet
    type: pserv
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./infra/yamnet/Dockerfile
    dockerContext: ./infra/yamnet
