name: API Uptime Check

# Runs from GitHub's own network (outside our infra), so it sees the API the
# way a real user or an App Store reviewer does — not just "reachable from
# the box itself". A failed scheduled run gets an automatic email from
# GitHub to the repo owner; no webhook or third-party account needed.
#
# This exists because the API's TLS cert lapsed silently once already
# (Sept 2026, no renewal timer was ever set up — see AWS_DEPLOY.md) and broke
# the app for every user, including failing an App Review submission. The
# renewal timer fixes the cause; this is the tripwire in case it (or
# anything else about the box) breaks again.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Health endpoint responds 200
        run: |
          curl -fsS --max-time 15 https://13.63.7.88.nip.io/health
          echo
          echo "health check OK"

      - name: TLS certificate has at least 14 days left
        run: |
          expiry=$(echo | openssl s_client -connect 13.63.7.88:443 -servername 13.63.7.88.nip.io 2>/dev/null \
            | openssl x509 -noout -enddate | cut -d= -f2)
          if [ -z "$expiry" ]; then
            echo "::error::could not read certificate expiry at all"
            exit 1
          fi
          expiry_epoch=$(date -d "$expiry" +%s)
          now_epoch=$(date +%s)
          days_left=$(( (expiry_epoch - now_epoch) / 86400 ))
          echo "certificate expires: $expiry ($days_left days left)"
          if [ "$days_left" -lt 14 ]; then
            echo "::error::TLS certificate expires in $days_left days — renewal timer may have failed, check the EC2 box (systemctl status certbot-renew.timer)"
            exit 1
          fi
